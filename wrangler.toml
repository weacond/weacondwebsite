# Cloudflare Worker 配置（通过 @cloudflare/next-on-pages 生成）
# 实际部署文件在 .next-on-pages/cloudflare-workers/
# 此文件为参考，主要配置在 deploy.yml 中

name = "weacond"
# 注意：compatibility_date 在下方统一定义为 2025-01-01（配合 nodejs_compat_v2）

# @cloudflare/next-on-pages 生成的函数需要 nodejs_compat 兼容标志，
# 缺失会导致所有 /api/* 路由 503 "no nodejs_compat compatibility flag"。
# 用 nodejs_compat_v2 + 较新的 compatibility_date（next-on-pages + Next 14 已知 async_hooks/async__chunk 500 bug 的缓解）。
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat_v2"]

# 这是 Pages 项目（wrangler pages deploy），用 pages_build_output_dir 指向静态产物，
# 不能用 Worker 的 main（二者互斥，会冲突导致构建失败）。
pages_build_output_dir = ".vercel/output/static"

# ===== R2 桶绑定（暂时注释；桶建好后再恢复）=====
# 现状：活体下载/读取走【Cloudflare REST API + 环境变量】，并不依赖下面的 wrangler 绑定：
#   lib/r2.js / lib/ebookStore.js / pages/api/ebook-content.js 用
#   R2_PUBLIC_URL + R2_ACCOUNT_ID + R2_API_TOKEN 直接打 api.cloudflare.com。
#   所以下面两段绑定其实是“冗余保险”——【不取消也不影响】卖书/下载/预览。
# 但：只要 [[r2_buckets]] 指向一个【不存在的桶】，`wrangler pages deploy` 就会失败。
#   所以【务必先建好桶】，再取消下面注释。
#
# 恢复步骤（按序）：
#   1) 填真实密钥：.env.local 写 CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID（或 R2_*）。
#   2) 建桶（幂等，自动开公共访问）：  npm run enable:r2
#   3) 自检（两桶都在才放行，可挂 CI 门禁）：  npm run check:r2   （即 enableR2 --check）
#   4) 上传内容：  node scripts/uploadR2.mjs --dry  → 再去掉 --dry
#   5) 取消下面两段注释，git push 触发 CI。
#
# [[r2_buckets]]
# binding = "R2_PUBLIC"
# bucket_name = "weacond-public"
#
# [[r2_buckets]]
# binding = "R2_PRIVATE"
# bucket_name = "weacond-private"

# 环境变量在 Cloudflare Dashboard 设置，不要在这里写实际值！
# 需要设置的环境变量：
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
#   SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL, SUPABASE_ANON_KEY
#   R2_ACCOUNT_ID, R2_API_TOKEN, R2_PUBLIC_URL
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY