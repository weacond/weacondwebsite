# Cloudflare Worker 配置（通过 @cloudflare/next-on-pages 生成）
# 实际部署文件在 .next-on-pages/cloudflare-workers/
# 此文件为参考，主要配置在 deploy.yml 中

name = "weacond"
compatibility_date = "2024-10-01"

# @cloudflare/next-on-pages 生成的函数需要 nodejs_compat 兼容标志，
# 缺失会导致所有 /api/* 路由 503 "no nodejs_compat compatibility flag"。
compatibility_flags = ["nodejs_compat"]

# 这是 Pages 项目（wrangler pages deploy），用 pages_build_output_dir 指向静态产物，
# 不能用 Worker 的 main（二者互斥，会冲突导致构建失败）。
pages_build_output_dir = ".vercel/output/static"

# R2 桶绑定暂时移除：
# 原绑定 weacond-public / weacond-private 在 Cloudflare 账号中不存在/不可达（HTTP 000），
# 导致 next-on-pages 生成的 worker 初始化失败、所有 /api/* 路由 500。
# 书列表已改为构建期本地 index.json 兜底，不依赖 R2；下载功能需后续重建 R2 桶再恢复。
#
# 待 R2 桶就绪后，恢复：
# [[r2_buckets]]
# binding = "R2_PUBLIC"
# bucket_name = "weacond-public"
#
# [[r2_buckets]]
# binding = "R2_PRIVATE"
# bucket_name = "weacond-private"

# 环境变量在 Cloudflare Dashboard 设置，不要在这里写实际值！
# 需要设置的环境变量：
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
#   SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL, SUPABASE_ANON_KEY
#   R2_ACCOUNT_ID, R2_API_TOKEN, R2_PUBLIC_URL
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY