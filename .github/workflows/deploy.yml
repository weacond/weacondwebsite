# Cloudflare Workers 部署（next-on-pages）
# 静态页面 + API 路由一起部署
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  # Job 1: 构建 + 部署到 Cloudflare Workers
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # next-on-pages + vercel 已列入 package.json 的 devDependencies，
      # 由上面的 `npm ci` 完整安装（进 lockfile，不会被 next-on-pages 内部二次 install 删除）。
      # 注意：这只是“构建期”借用的工具，线上网站 100% 跑在 Cloudflare，不花 Vercel 一分钱。
      - name: Build with next-on-pages
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: "deploy .next-on-pages/cloudflare-workers --name weacond --compatibility-date=2024-10-01"
          # 服务端环境变量（只在运行时使用，不进前端）
          secretVars: |
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_API_TOKEN=${{ secrets.R2_API_TOKEN }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}

  # Job 2: 只同步【预览 + 目录】到公开 R2 桶（绝不传全文）
  sync-public-r2:
    needs: deploy-worker
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard — 防止全文误传公开桶
        run: |
          # 保险丝：public/ebooks 下绝不能出现 content/ 目录或任何全文文件
          if find ./public/ebooks -type f -path '*content*' 2>/dev/null | grep -q .; then
            echo "❌ 检测到 public/ebooks 下存在 content/ 文件，这会泄漏全文，构建失败。"
            find ./public/ebooks -type f -path '*content*'
            exit 1
          fi
          echo "✓ 公开桶无全文文件，安全。"
      - name: Sync preview + index to R2 public bucket
        run: |
          # 只上传 preview/ 下的文件（第1章预览），key 前缀保留 preview/
          for f in $(find ./public/ebooks/preview -type f 2>/dev/null); do
            key="preview/$(basename "$f")"
            echo "Uploading public: $key"
            curl -s -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: text/markdown; charset=utf-8" \
              --data-binary @"$f" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/weacond-public/objects/$key"
          done
          # 目录索引 index.json（仅元数据，无正文）
          curl -s -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @./public/ebooks/index.json \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/weacond-public/objects/index.json"
          echo "✓ 公开桶同步完成（仅 preview + index.json）"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # Job 3: 把【全书正文】上传到【私有】R2 桶（key = content/{slug}.md）
  sync-private-r2:
    needs: deploy-worker
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync full content to R2 private bucket
        run: |
          if [ -d ./private/ebooks/content ]; then
            for f in $(find ./private/ebooks/content -type f 2>/dev/null); do
              key="content/$(basename "$f")"
              echo "Uploading private: $key"
              curl -s -X PUT \
                -H "Authorization: Bearer $R2_API_TOKEN" \
                -H "Content-Type: text/markdown; charset=utf-8" \
                --data-binary @"$f" \
                "https://api.cloudflare.com/client/v4/accounts/$R2_ACCOUNT_ID/r2/buckets/weacond-private/objects/$key"
            done
            echo "✓ 私有桶同步完成（全文仅存私有桶，公开桶不可见）"
          else
            echo "无 private/ebooks/content 目录，跳过。"
          fi
        env:
          R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
